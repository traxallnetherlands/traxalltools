<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraXall Tools</title>

    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #213153;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 20px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: fit-content;
        }

        .image-container img {
            max-width: 250px;
            height: auto;
        }

        .buttons-container {
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(5, auto);
            gap: 20px;
        }

        .button {
            width: 280px;
            padding: 15px;
            background-color: #213153;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }

        .button:hover {
            background-color: #18243d;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="image-container">
            <img src="logo-traxall-tools.png" alt="TraXall Tools Logo">
        </div>

        <div class="buttons-container">

            <a href="https://traxallnetherlands.github.io/rdw-kentekendata/" class="button">
                RDW Kentekendata
            </a>

            <a href="https://traxallnetherlands.github.io/factuurcontrole/" class="button">
                Factuurcontrole
            </a>

            <a href="https://traxallnetherlands.github.io/inhoudingen/" class="button">
                Inhoudingen (Work in Progress)
            </a>

            <a href="https://traxallnetherlands.github.io/bijtellingscalculator/" class="button">
                Bijtellingscalculator
            </a>

            <a href="https://traxallnetherlands.github.io/aantallenvoorfacturen/" class="button">
                Aantallen (Work in Progress)
            </a>

            <a href="https://traxallnetherlands.github.io/contractwijziging-matrixcontrole/" class="button">
                Contractwijziging Matrixcontrole
            </a>

            <a href="https://traxallnetherlands.github.io/update-kilometerstanden/" class="button">
                Update kilometerstanden
            </a>

            <a href="https://traxallnetherlands.github.io/vloot-analyse-intern/" class="button">
                Vloot Analyse Intern
            </a>

            <a href="https://traxallnetherlands.github.io/kostenrapportagev0.1/" class="button">
                Kostenrapportage
            </a>

            <a href="https://traxallnetherlands.github.io/mutatierapportage/" class="button">
                Mutatierapportage
            </a>
            
            <a href="https://traxallnetherlands.github.io/mutatierapportage/" class="button">
                Testknop
            </a>
            
            <a href="https://traxallnetherlands.github.io/mutatierapportage/" class="button">
                Testknop2
            </a>
                        
        </div>

    </div>

</body>
</html>
