<!DOCTYPE html>
<html lang="nl">

    <style>
        body, html {

            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #213153;
        }

        .container {
            display: flex;
            flex-direction: column;

            text-align: center;
            gap: 20px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 400px;

        }

        .image-container img {
            max-width: 250px;
            height: auto;
        }

        h1 {
            color: #213153;
            margin-bottom: 10px;
        }

        .button {
            width: 100%;
            padding: 15px;
            background-color: #213153;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

        .button:hover {
            background-color: #18243d;
        }
    </style>
</head>
